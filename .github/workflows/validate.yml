name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Run unified validation suite
        run: bash tests/run_all_tests.sh

      - name: Run E2E regression tests
        run: bash tests/validate_e2e_regression.sh

      - name: Run context pollution regression tests
        run: bash tests/validate_security_regression.sh
