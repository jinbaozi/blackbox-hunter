name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Schema validation
        run: bash tests/validate_schemas.sh

      - name: Script and documentation validation
        run: bash tests/validate_scripts.sh

      - name: YARA rule validation
        run: bash tests/validate_rules.sh

      - name: Python compile validation
        run: bash tests/validate_python.sh

      - name: Preflight validation
        run: bash tests/validate_preflight.sh

      - name: Preflight contract validation
        run: bash tests/validate_preflight_contracts.sh

      - name: Adapter validation
        run: bash tests/validate_adapters.sh

      - name: Confidence scoring validation
        run: bash tests/validate_confidence_scoring.sh

      - name: Action gate and sandbox validation
        run: bash tests/validate_action_gate_sandbox.sh

      - name: Security regression validation
        run: bash tests/validate_security_regression.sh

      - name: E2E regression validation
        run: bash tests/validate_e2e_regression.sh

      - name: RPM E2E validation
        run: bash tests/validate_rpm_e2e.sh

      - name: Full workflow validation
        run: bash tests/validate_full_workflow.sh

      - name: Non-duplicative coverage validation
        run: bash tests/validate_nonduplicate_coverage.sh

      - name: Optional RPM integration validation
        run: bash tests/validate_integration_rpm.sh

      - name: Optional Track A integration validation
        run: bash tests/validate_integration_track_a.sh

      - name: Optional sandbox integration validation
        run: bash tests/validate_integration_sandbox.sh

      - name: Legacy unified local entrypoint
        run: bash tests/run_all_tests.sh
