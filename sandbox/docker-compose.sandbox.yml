version: "3.8"

services:
  poc-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.poc
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: ${CONTAINER_NAME:-bbh-poc-sandbox-${SCAN_ID:-local}}
    network_mode: "none"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=seccomp-profile.json
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m
      - /workspace/tmp:size=512m,uid=1000,gid=1000
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
          pids: 100
    volumes:
      - type: bind
        source: ${POC_DIR:-./poc}
        target: /poc
        read_only: true
      - type: bind
        source: ${PACKAGE_DIR:-./pkg}
        target: /pkg
        read_only: true
      - type: bind
        source: ${RESULTS_DIR:-./black-audit-output/results}
        target: /workspace/results
        read_only: false
    environment:
      POC_SCRIPT: ${POC_SCRIPT:-/poc/run.sh}
      TIMEOUT: ${TIMEOUT:-300}
      OUTPUT_DIR: /workspace/results
      # B8: sanitizer options exported into the PoC sandbox. abort_on_error
      # is mandatory so a sanitizer violation terminates the run with a
      # recognisable exit code (ASAN=42, MSAN=77, UBSAN=1). detect_leaks
      # adds memory-leak detection for ASan; MSan ignores it.
      SANITIZER: ${SANITIZER:-none}
      ASAN_OPTIONS: ${ASAN_OPTIONS:-abort_on_error=1:detect_leaks=1:exitcode=42}
      MSAN_OPTIONS: ${MSAN_OPTIONS:-exitcode=77}
      UBSAN_OPTIONS: ${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1:exitcode=1}
